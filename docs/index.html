<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Chat with PyBot, a rule-based chatbot written in Python.">
    <title>PyBot | Browser chat</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">No weights. No training. Just rules.</p>
        <h1>PyBot</h1>
        <p class="intro">A chatbot written in Python, running entirely in your browser.</p>
      </header>

      <section class="chat-card" aria-label="PyBot chat">
        <div id="chat-log" class="chat-log" role="log" aria-live="polite">
          <div class="message bot-message">
            <span class="message-label">PyBot</span>
            <p>Loading PyBot...</p>
          </div>
        </div>
        <form id="chat-form" class="chat-form">
          <label class="sr-only" for="message-input">Message PyBot</label>
          <input id="message-input" name="message" type="text"
                 placeholder="Ask PyBot something..." autocomplete="off" disabled>
          <button id="send-button" type="submit" disabled>Send</button>
        </form>
        <p id="status" class="status" role="status">Downloading the Python runtime and PyBot source...</p>
      </section>

      <footer>
        <a href="https://github.com/alanmaizon/pybot">View the source on GitHub</a>
        <span aria-hidden="true">·</span>
        <button id="reset-button" class="link-button" type="button" disabled>Reset conversation</button>
      </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <script src="app.js"></script>
  </body>
</html>
